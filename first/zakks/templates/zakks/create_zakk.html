{% extends 'zakks/base.html' %}

{% block title %}Создать закк — Zakker{% endblock %}

{% block content %}

<div class="zakk-form create-form-box" style="margin: 0 auto;">
    <h2 class="form-title">Создать новый закк</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button type="submit" class="submit-btn">Опубликовать</button>
            <a href="{% url 'feed' %}" class="submit-btn"
               style="background-color: #ccc; text-align: center; text-decoration: none; line-height: 24px;">
                Отмена
            </a>
        </div>
    </form>
</div>

{% endblock %}
